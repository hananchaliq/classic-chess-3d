<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2C241D" />
      <stop offset="65%" stop-color="#171411" />
      <stop offset="100%" stop-color="#0D0B09" />
    </radialGradient>
    <linearGradient id="goldCrown" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E3B4" />
      <stop offset="35%" stop-color="#D8B572" />
      <stop offset="70%" stop-color="#B38942" />
      <stop offset="100%" stop-color="#7B5924" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6C98F" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#9A7438" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E6C98F" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Crest Shield / Tile -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="2" />

  <!-- Subtle Chessboard Corner Accents -->
  <rect x="8" y="8" width="6" height="6" rx="1.5" fill="#C7A66A" fill-opacity="0.14" />
  <rect x="50" y="8" width="6" height="6" rx="1.5" fill="#C7A66A" fill-opacity="0.14" />
  <rect x="8" y="50" width="6" height="6" rx="1.5" fill="#C7A66A" fill-opacity="0.14" />
  <rect x="50" y="50" width="6" height="6" rx="1.5" fill="#C7A66A" fill-opacity="0.14" />

  <!-- Staunton King Cross Finial -->
  <path
    d="M30.2 8.5H33.8V12.2H37.5V15.8H33.8V19.5H30.2V15.8H26.5V12.2H30.2V8.5Z"
    fill="url(#goldCrown)"
  />

  <!-- Royal Crown & Mitre Silhouette -->
  <path
    d="M20 23.5L25.5 19.5L32 23L38.5 19.5L44 23.5L41.2 33.5H22.8L20 23.5Z"
    fill="url(#goldCrown)"
  />

  <!-- Crown Jewels / Highlights -->
  <circle cx="32" cy="26.5" r="1.8" fill="#171411" />
  <circle cx="26.2" cy="27.2" r="1.4" fill="#171411" />
  <circle cx="37.8" cy="27.2" r="1.4" fill="#171411" />

  <!-- King Collar -->
  <rect x="21.5" y="35" width="21" height="3.2" rx="1.6" fill="url(#goldCrown)" />

  <!-- Sculpted Staunton Pillar Body -->
  <path
    d="M24.2 39.5H39.8L42.5 47.5H21.5L24.2 39.5Z"
    fill="url(#goldCrown)"
  />

  <!-- Double Pedestal Base -->
  <rect x="18.5" y="49" width="27" height="3.2" rx="1.6" fill="url(#goldCrown)" />
  <rect x="15.5" y="53.5" width="33" height="4" rx="2" fill="url(#goldCrown)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Editorial Medallion Shield in Deep Espresso #291C0E and Roasted Chestnut #6E473B -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#291C0E" stroke="#A78D78" stroke-width="2.5" />
  <rect x="7" y="7" width="50" height="50" rx="12" fill="#6E473B" fill-opacity="0.35" stroke="#BEB5A9" stroke-width="1" stroke-opacity="0.45" />

  <!-- Subtle 2x2 Chessboard Corner Accents -->
  <rect x="10" y="10" width="5" height="5" rx="1" fill="#A78D78" fill-opacity="0.35" />
  <rect x="49" y="10" width="5" height="5" rx="1" fill="#A78D78" fill-opacity="0.35" />
  <rect x="10" y="49" width="5" height="5" rx="1" fill="#A78D78" fill-opacity="0.35" />
  <rect x="49" y="49" width="5" height="5" rx="1" fill="#A78D78" fill-opacity="0.35" />

  <!-- Royal Crown atop the Knight -->
  <path
    d="M23 16.5L26.5 11.5L31.5 15L36.5 11.5L40 16.5H23Z"
    fill="#E1D4C2"
    stroke="#291C0E"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <circle cx="26.5" cy="10" r="1.4" fill="#BEB5A9" />
  <circle cx="31.5" cy="9.2" r="1.6" fill="#E1D4C2" />
  <circle cx="36.5" cy="10" r="1.4" fill="#BEB5A9" />

  <!-- Sculpted Staunton Royal Knight Silhouette -->
  <path
    d="M22 44C22 35.5 29.5 36.5 28.5 29.5C25 30.8 20.5 32.5 19 29.5C17.5 26.8 21.5 22.2 25.5 21L27 18H33.5C42.5 19.5 46.5 27.5 45.5 44H22Z"
    fill="#E1D4C2"
    stroke="#291C0E"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <!-- Knight Eye & Mane Carving -->
  <circle cx="25.5" cy="24" r="1.6" fill="#291C0E" />
  <path
    d="M36.5 22.5C40.5 25.5 42 32 41.5 41"
    stroke="#6E473B"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Pedestal Collar & Base -->
  <rect x="19.5" y="44" width="25" height="3.8" rx="1.8" fill="#BEB5A9" stroke="#291C0E" stroke-width="1.5" />
  <path
    d="M16.5 52.5H47.5C47.5 49.2 44.5 47.8 42 47.8H22C19.5 47.8 16.5 49.2 16.5 52.5Z"
    fill="#E1D4C2"
    stroke="#291C0E"
    stroke-width="1.6"
    stroke-linejoin="round"
  />
</svg>
